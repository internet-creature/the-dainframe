name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install poetry
        run: pipx install poetry

      - name: install
        run: poetry install --all-extras

      - name: black
        run: poetry run black --check dainframe tests

      - name: pytest
        run: poetry run pytest
